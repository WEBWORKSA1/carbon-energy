name: Refresh data, news and country pages

# Copy of .github/workflows/update.yml (kept here as a backup in case the
# workflow file needs to be re-added through the GitHub web UI).

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours: news; data/pages refresh when sources update
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pycountry
      - name: Build pages from src/
        run: python scripts/build.py
      - name: Refresh data, news, country pages and sitemap
        run: python scripts/update_data.py
      - name: Commit changes
        run: |
          git config user.name "carbon-energy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-update: data, news, country pages, sitemap"
          git pull --rebase origin main
          git push
      - name: Ensure GitHub Pages is enabled (main / root)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 || \
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" || true
      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
